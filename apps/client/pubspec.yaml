name: ionic_client
description: Flutter Android-first mobile and web client for Ionic social application.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.1
  file_picker: ^13.1.0
  flutter_secure_storage: ^11.2.0
  image: ^4.12.0
  image_picker: ^1.2.4
  http: ^1.6.0
  just_audio: ^0.10.6
  record: ^7.1.2
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/ionic-logo-lockup.png
    - assets/ionic-mark.png
